name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm biome:ci
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          E2E_DATA_DIR: ${{ runner.temp }}/platform-e2e
      - run: pnpm db:doctor
        env:
          PLATFORM_DATA_DIR: ${{ runner.temp }}/platform-doctor
      - run: pnpm security:check
        env:
          PLATFORM_DATA_DIR: ${{ runner.temp }}/platform-doctor
      - run: pnpm audit --prod --audit-level high
      - run: pnpm licenses list --prod

  nix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix develop --command pnpm install --frozen-lockfile
      - run: nix develop --command pnpm test:examples
      - run: nix develop --command pnpm test:deployment
      - run: nix flake check --print-build-logs
      - run: nix build --print-build-logs

  harbur-private:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix develop --command pnpm install --frozen-lockfile
      - name: Deploy the private Harbur acceptance repository
        run: nix develop --command pnpm test:harbur-private
        env:
          HARBUR_INTEGRATION_READ_TOKEN: ${{ secrets.HARBUR_INTEGRATION_READ_TOKEN }}
